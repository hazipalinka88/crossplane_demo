
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: appstack-local
spec:
  compositeTypeRef:
    apiVersion: platform.example.org/v1alpha1
    kind: AppStack

  mode: Pipeline
  pipeline:
    - step: create-app-resources
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:

          # 1. CONFIGMAP
          - name: app-config
            base:
              apiVersion: v1
              kind: ConfigMap
              data:
                managedBy: crossplane
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-config"

              - type: FromCompositeFieldPath
                fromFieldPath: spec.environment
                toFieldPath: data.environment

              - type: FromCompositeFieldPath
                fromFieldPath: spec.environment
                toFieldPath: data.logLevel
                transforms:
                  - type: map
                    map:
                      dev: debug
                      staging: info
                      prod: warn

              - type: FromCompositeFieldPath
                fromFieldPath: spec.team
                toFieldPath: data.team

            readinessChecks:
              - type: None

          # 2. DEPLOYMENT
          - name: app-deployment
            base:
              apiVersion: apps/v1
              kind: Deployment
              spec:
                replicas: 1
                selector:
                  matchLabels:
                    app: payment-demo
                template:
                  metadata:
                    labels:
                      app: payment-demo
                  spec:
                    containers:
                      - name: nginx
                        image: nginx:1.27-alpine
                        ports:
                          - containerPort: 80
                        env:
                          - name: APP_ENV
                            value: dev
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-app"

              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.selector.matchLabels.app
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-app"

              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.template.metadata.labels.app
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-app"

              - type: FromCompositeFieldPath
                fromFieldPath: spec.environment
                toFieldPath: spec.template.spec.containers[0].env[0].value

            readinessChecks:
              - type: MatchInteger
                fieldPath: status.readyReplicas
                matchInteger: 1

          # 3. SERVICE
          - name: app-service
            base:
              apiVersion: v1
              kind: Service
              spec:
                type: ClusterIP
                selector:
                  app: payment-demo
                ports:
                  - name: http
                    port: 80
                    targetPort: 80
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-svc"

              - type: FromCompositeFieldPath
                fromFieldPath: metadata.name
                toFieldPath: spec.selector.app
                transforms:
                  - type: string
                    string:
                      type: Format
                      fmt: "%s-app"

            readinessChecks:
              - type: None
